[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-mouse-pro-mac"
version = "0.1.0"
description = "Native macOS face-controlled pointer with Apple Vision and the shared Face Mouse Pro core"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["face-mouse-pro-core @ git+https://github.com/SiddanthReddy/face-mouse-pro-core.git@7ae514e29578f09a819ae4f5bb84218049e338e5"]

[project.optional-dependencies]
macos = ["pyobjc-framework-Cocoa>=10.0", "pyobjc-framework-AVFoundation>=10.0", "pyobjc-framework-Vision>=10.0", "pyobjc-framework-Quartz>=10.0", "pyobjc-framework-CoreMedia>=10.0", "pyobjc-framework-libdispatch>=10.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.13", "pyinstaller>=6.11"]

[project.scripts]
face-mouse-pro-mac = "face_mouse_pro_mac.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests"]
