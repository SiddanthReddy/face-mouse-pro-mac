name: macOS CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
jobs:
  quality:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[macos,dev]'
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -q
      - run: python -m compileall -q src tests
      - run: python packaging/validate_bundle.py
